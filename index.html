<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: satu halaman kasir. Kiri daftar menu, kanan keranjang pesanan (di ponsel ditumpuk, dengan bilah total di bawah). Pemilik mendapat tab tambahan Menu, Keuangan, Pengaturan. */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --surface2:#F4F6F4; --ink:#1E2420; --muted:#66716A; --line:#E1E6E2;
  --accent:#2B8F28; --accent-ink:#FFFFFF; --accent-soft:#E2F2DF; --amber:#FFB81F; --amber-ink:#2A1F00; --info:#2B5FB3; --info-bg:#E2EBF8; --hdr-a:#0D4F27; --hdr-b:#2B8F28; --hdr-ink:#FFFFFF; --sh:0 1px 2px rgba(14,40,22,.05),0 8px 24px rgba(14,40,22,.06);
  --good:#1E7A4B; --good-bg:#DDF1E5; --warn:#A65A05; --warn-bg:#FBEBD3; --bad:#B3261E; --bad-bg:#F9DEDC;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111713; --surface:#1A221D; --surface2:#222B25; --ink:#E8EEE9; --muted:#98A59D; --line:#2D3832;
    --accent:#5FC956; --accent-ink:#0C1F0A; --accent-soft:#1F3A1D; --amber:#FFC247; --amber-ink:#241A00; --info:#8DB4F2; --info-bg:#1C2A44; --hdr-a:#0F3320; --hdr-b:#1D5C2C; --hdr-ink:#E9F6E7; --sh:0 1px 2px rgba(0,0,0,.45);
    --good:#6FD39A; --good-bg:#1D3A2A; --warn:#F0B35E; --warn-bg:#3D2E14; --bad:#F2938C; --bad-bg:#43201E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#1A221D; --surface2:#222B25; --ink:#E8EEE9; --muted:#98A59D; --line:#2D3832;
  --accent:#5FC956; --accent-ink:#0C1F0A; --accent-soft:#1F3A1D; --amber:#FFC247; --amber-ink:#241A00; --info:#8DB4F2; --info-bg:#1C2A44; --hdr-a:#0F3320; --hdr-b:#1D5C2C; --hdr-ink:#E9F6E7; --sh:0 1px 2px rgba(0,0,0,.45);
  --good:#6FD39A; --good-bg:#1D3A2A; --warn:#F0B35E; --warn-bg:#3D2E14; --bad:#F2938C; --bad-bg:#43201E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);
  padding-block:12px 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.2}
h3{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted,.hint{color:var(--muted)}
.hint{font-size:13px}

/* controls */
.inp{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.inp.sm{min-height:38px;padding:6px 10px;font-size:14px}
textarea.inp{min-height:68px;resize:vertical}
.inp::placeholder{color:var(--muted);opacity:.8}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger-t{color:var(--bad)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.paid{background:var(--good-bg);color:var(--good)}
.pill.waiting{background:var(--warn-bg);color:var(--warn)}
.pill.collective{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;vertical-align:middle}
.empty{padding:28px 16px;text-align:left;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:20px}

/* login */
.login{max-width:400px;margin:7vh auto 0;display:grid;gap:16px}
.login h1{font-size:30px}
.login form{display:grid;gap:14px}

/* header + tabs */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 12px}
.brand{font-family:var(--font-display);font-weight:700;font-size:23px;letter-spacing:-.01em}
.clock{color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.uname{font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* kasir */
.pos{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.pos-menu{display:grid;gap:14px;align-content:start;min-width:0}
.tools{display:grid;gap:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.item{position:relative;display:grid;grid-template-rows:auto;text-align:left;padding:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.item:active{background:var(--surface2)}
.it-b{display:grid;gap:2px;padding:10px 12px;align-content:start}
.item .nm{font-weight:600;line-height:1.25}
.item .pr{color:var(--muted);font-size:14px;font-weight:600}
.item[disabled]{opacity:.55;cursor:not-allowed}
.item[disabled] img{filter:grayscale(1)}
.ph{display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;background:var(--surface2);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph i{font:700 32px var(--font-display);font-style:normal;color:var(--muted)}
.mcard .ph{border-radius:8px}
.photo{display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;background:var(--surface2);border:1px dashed var(--line);border-radius:8px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph-empty{color:var(--muted);font-size:13px;font-weight:600}
.filebtn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.item .badge{position:absolute;top:8px;right:8px;min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:grid;place-items:center}
.custom{display:grid;gap:10px}
.custom form{display:grid;gap:10px;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,.6fr) auto;align-items:end}
.pos-cart{display:grid;gap:12px;align-content:start;min-width:0}
.pos-cart h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.two{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stamp{font-size:13px;font-weight:600;color:var(--accent)}
.cl{display:grid;gap:10px}
.ci{display:grid;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ci-top{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.ci-ctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{width:38px;height:38px;border:0;background:var(--surface2);font-size:18px;font-weight:700}
.qty span{min-width:32px;text-align:center;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}

/* keuangan */

/* ---- tampilan kasir ala POS: pesanan di kiri, katalog di kanan ---- */

.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:14px}

/* ===== penyempurnaan tema: tampilan aplikasi profesional ===== */

/* ===== cetak & ekspor laporan ===== */
.rep-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.rep-act{display:flex;gap:8px;flex-wrap:wrap}
.btn.xl-b{background:var(--good);border-color:var(--good);color:#fff}
#printarea{display:none}
.lastbox{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--good-bg);color:var(--good);font-weight:700;font-size:14px}
.bookbox{display:grid;gap:10px;margin-bottom:12px}
.dates{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.dates label.f{min-width:150px;flex:1}
.rcpt-wrap{display:none}
@media print{
  @page{size:A4;margin:14mm}
  #printarea.rcpt{font:12px/1.35 'Courier New',Courier,monospace;color:#000}
  #printarea.rcpt .rc-c{text-align:center}
  #printarea.rcpt .rc-shop{font-weight:700;font-size:16px}
  #printarea.rcpt .rc-hr{border-top:1px dashed #000;margin:6px 0}
  #printarea.rcpt .rc-row{display:flex;justify-content:space-between;gap:6px}
  #printarea.rcpt .rc-row span:last-child{text-align:right;white-space:nowrap}
  #printarea.rcpt .rc-b{font-weight:700}
  #printarea.rcpt .rc-n{font-size:11px;padding-left:8px}

  html,body{background:#fff!important;color:#000!important}
  body{padding:0!important}
  body>*:not(#printarea){display:none!important}
  #printarea{display:block!important;font:12px/1.4 Arial,Helvetica,sans-serif;color:#000}
  #printarea h1{font:700 20px Arial,sans-serif;margin:0 0 2px}
  #printarea h2{font:700 14px Arial,sans-serif;margin:16px 0 6px}
  #printarea .pm{color:#333;margin-bottom:10px}
  #printarea table{width:100%;border-collapse:collapse;margin-bottom:6px}
  #printarea th,#printarea td{border:1px solid #888;padding:4px 6px;text-align:left;vertical-align:top}
  #printarea th{background:#e8e8e8}
  #printarea td.r,#printarea th.r{text-align:right}
  #printarea tr{page-break-inside:avoid}
  #printarea .sum td:first-child{font-weight:700;width:55%}
  #printarea tfoot td{font-weight:700;background:#f2f2f2}
}
</style>

async function hash(s){
  try{
    if(window.crypto&&crypto.subtle){
      var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
    }
  }catch(e){}
  var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
  return 'f'+(h>>>0).toString(16);
}
function pw(u,p){return hash('warkop|'+String(u).toLowerCase()+'|'+p)}

/* v2: menu contoh dikosongkan; status bayar jadi Menunggu / Kolektif / Lunas; metode Cash / QRIS / Transfer */
function migrate(d){
  if((d.v||1)<2){
    d.menu=d.menu.filter(function(m){return !/^m\d{1,2}$/.test(m.id)});
    d.orders.forEach(function(o){
      if(o.pay&&o.pay.status==='unpaid')o.pay={status:'waiting'};
      if(o.pay&&o.pay.method==='Tunai')o.pay.method='Cash';
    });
    d.v=2;
  }
  if(d.v<3){
    /* v3: menu dikelompokkan jadi Makanan (atas) dan Minuman (bawah) */
    d.menu.forEach(function(m){
      if(m.cat!=='Makanan'&&m.cat!=='Minuman')m.cat=/kopi|teh|jeruk|susu|jus|\bes\b|minum|air|sirup|soda/i.test(m.cat+' '+m.name)?'Minuman':'Makanan';
    });
    d.v=3;
  }
  if(d.v<4){
    /* v4: isi menu Warkop Waras jika daftar menu masih kosong */
    if(!d.menu.length)d.menu=defaultMenu();
    d.v=4;
  }
  if(d.v<5){
    /* v5: menu bawaan memakai pilihan (Panas/Dingin, jenis biji) dalam satu menu */
    if(d.menu.some(function(m){return /^w\d{3}$/.test(m.id)})){
      d.menu=d.menu.filter(function(m){return !/^w\d{3}$/.test(m.id)}).concat(defaultMenu());
    }
    d.v=5;
  }
  if(d.v<6){d.closings=d.closings||[];d.receipt=Object.assign(rcDef(),d.receipt||{});d.v=6}
  return d;
}
function grp(m){return m.cat==='Minuman'?'Minuman':'Makanan'}
/* Pengelompokan & urutan mengikuti buku menu Warkop Waras (bukan urutan abjad) */
var MENU_ORDER=[
  ['Makanan berat',['Ayam Goreng Kremes','Nasi Goreng']],
  ['Mie',['Ifu Mie','Mie Tiau','Indomie Goreng','Indomie Kuah']],
  ['Camilan',['Kentang','Tempura','Sosis','Otak-otak','Tahu Balek','Naget','Mix 2 Varian','Mix 3 Varian']],
  ['Kopi',['Espresso Single','Americano','Sanger','Caffe Latte','Kopi Susu','Kopi Susu GL Aren','Espresso Double']],
  ['Menu Spesial',['Matcha Coffee Latte','Avocado Coffee Latte','Caramel Coffee Latte','Mocha Coffee Latte','Thai Tea','Matcha','Coklat','Red Velvet','Taro','Cappucino']],
  ['Squash',['Orange Squash','Strawberry Squash','Ocean Blue Squash','Lemon Squash','Lycee Squash','Grape Squash']],
  ['Jus & Minuman Khas',['Jus Jeruk','Jus Timun','Jus Buah Naga','Jus Alpukat','Kopi Susu Telor (KST) Peaberry','Teh Susu Telor (TST)','Wedang Waras (Jahe Serai Kunyit Nipis Madu)','Telor 1/2 Matang']],
  ['Teh, Susu & Lainnya',['Lemon Tea','Teh Manis','Teh Hijau','Teh Susu','Teh Jahe','Susu','Es Kosong']]
];
var MENU_POS=(function(){var p={},i=0;MENU_ORDER.forEach(function(g){g[1].forEach(function(n){p[n.toLowerCase()]={g:g[0],i:i++}})});return p})();
function menuGroupOrder(g){return g==='Minuman'?['Kopi','Menu Spesial','Squash','Jus & Minuman Khas','Teh, Susu & Lainnya','Minuman lainnya']:['Makanan berat','Mie','Camilan','Makanan lainnya']}
function menuRank(m){var p=MENU_POS[(m.name||'').trim().toLowerCase()];return p?p.i:10000+D.menu.indexOf(m)}
function menuSubgroup(m){
  var n=(m.name||'').toLowerCase(), p=MENU_POS[n.trim()];
  if(p&&menuGroupOrder(grp(m)).indexOf(p.g)>=0)return p.g;
  /* menu baru buatan pemilik: tebak kelompok dari namanya */
  if(grp(m)==='Minuman'){
    if(/squash/.test(n))return 'Squash';
    if(/jus|juice|smoothie|wedang|telor/.test(n))return 'Jus & Minuman Khas';
    if(/kopi|espresso|americano|latte|cappuccino|cappucino|mocha|macchiato|robusta|arabika|affogato|sanger/.test(n))return 'Kopi';
    if(/matcha|taro|velvet|coklat|cokelat|chocolate|thai/.test(n))return 'Menu Spesial';
    if(/teh|tea|susu|milk|es kosong/.test(n))return 'Teh, Susu & Lainnya';
    return 'Minuman lainnya';
  }
  if(/mie|mi |bakmi|indomie|spaghetti|kwetiau|bihun/.test(n))return 'Mie';
  if(/nasi|rice|ayam|bebek|ikan|lele|soto|sop|sup|bakso|sate|rendang/.test(n))return 'Makanan berat';
  if(/roti|toast|sandwich|burger|pizza|martabak|pisang|kentang|goreng|snack|keripik|cireng|pempek/.test(n))return 'Camilan';
  return 'Makanan lainnya';
}

function rangeOf(k){
  var n=new Date(),s=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  function pd(v){var p=String(v||'').split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):s}
  if(k==='custom'){var a=pd(S.fdate.from),b=pd(S.fdate.to||S.fdate.from);return [a,new Date(b.getFullYear(),b.getMonth(),b.getDate()+1)]}
  if(k==='date'){var c=pd(S.of.date);return [c,new Date(c.getFullYear(),c.getMonth(),c.getDate()+1)]}
  if(k==='today')return [s,new Date(s.getTime()+864e5)];
  if(k==='7d')return [new Date(s.getTime()-6*864e5),new Date(s.getTime()+864e5)];
  if(k==='month')return [new Date(n.getFullYear(),n.getMonth(),1),new Date(n.getFullYear(),n.getMonth()+1,1)];
  return [new Date(0),new Date(8.64e15)];
}

function handlePhoto(inp){
  var file=inp.files&&inp.files[0];if(!file)return;
  if(!/^image\//.test(file.type)){toast('Pilih file gambar.');return}
  var rd=new FileReader();
  rd.onerror=function(){toast('Foto tidak bisa dibaca.')};
  rd.onload=function(){
    var img=new Image();

function rangeLabel(k){
  if(k==='all')return 'Semua data';
  var r=rangeOf(k),a=r[0],b=new Date(r[1].getTime()-1);
  var nm={today:'Harian',['7d']:'Mingguan',month:'Bulanan',custom:'Periode',date:'Tanggal'}[k];
  return nm+': '+(k==='today'||+a===+new Date(b.getFullYear(),b.getMonth(),b.getDate())?fmtDayS(a):fmtDayS(a)+' s/d '+fmtDayS(b));
}
function repData(k){
  var orders=D.orders.filter(function(o){return inRange(o,k)}).sort(function(a,b){return new Date(a.ts)-new Date(b.ts)});
  var sum={n:orders.length,paid:0,waiting:0,coll:0,np:0,nw:0,nc:0,all:0};
  var days={},meth={};
  orders.forEach(function(o){
    var t=otot(o),d=new Date(o.ts),key=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    var g=days[key]||(days[key]={d:new Date(d.getFullYear(),d.getMonth(),d.getDate()),n:0,paid:0,waiting:0,coll:0,all:0});
    g.n++;g.all+=t;sum.all+=t;
    if(o.pay.status==='paid'){sum.paid+=t;sum.np++;g.paid+=t;meth[o.pay.method]=(meth[o.pay.method]||0)+t}
    else if(o.pay.status==='collective'){sum.coll+=t;sum.nc++;g.coll+=t}
    else{sum.waiting+=t;sum.nw++;g.waiting+=t}
  });
  var dl=Object.keys(days).sort().map(function(x){return days[x]});
  return {orders:orders,sum:sum,days:dl,meth:meth};
}

function viewKeuangan(){
  if(!isOwner())return '';

  if(!S.fdate.from){var tdy=toLocalInput(new Date()).slice(0,10);S.fdate={from:tdy,to:tdy}}

  var paid=orders.filter(function(o){return o.pay.status==='paid'});
  var waiting=orders.filter(function(o){return o.pay.status==='waiting'});
  var coll=orders.filter(function(o){return o.pay.status==='collective'});
  var rev=paid.reduce(function(s,o){return s+otot(o)},0);
  var wsum=waiting.reduce(function(s,o){return s+otot(o)},0);
  var csum=coll.reduce(function(s,o){return s+otot(o)},0);
  var avg=paid.length?rev/paid.length:0;
  var days=[];
  for(var k=6;k>=0;k--){
    var b=new Date();b=new Date(b.getFullYear(),b.getMonth(),b.getDate()-k);
    var e=new Date(b.getFullYear(),b.getMonth(),b.getDate()+1);
    var v=D.orders.filter(function(o){var t=new Date(o.ts);return o.pay.status==='paid'&&t>=b&&t<e}).reduce(function(s,o){return s+otot(o)},0);
    days.push({v:v,wk:new Intl.DateTimeFormat('id-ID',{weekday:'short'}).format(b),dt:b.getDate(),now:k===0});
  }

    '<div class="rep-act"><button class="btn ghost" data-act="printrep">Cetak laporan</button><button class="btn xl-b" data-act="xlsrep">Unduh Excel</button></div></div>'+
    (S.frange==='custom'?'<div class="dates panel"><label class="f" for="fd1">Dari tanggal<input class="inp sm" id="fd1" type="date" data-f="fd1" value="'+S.fdate.from+'"></label><label class="f" for="fd2">Sampai tanggal<input class="inp sm" id="fd2" type="date" data-f="fd2" value="'+S.fdate.to+'"></label></div>':'')+
    '<p class="hint">Cetak dan Excel mengikuti periode yang dipilih: '+esc(rangeLabel(S.frange))+'. Isinya ringkasan keuangan, rekap per hari, dan daftar semua pembelian beserta rincian menu.</p>'+
    '<div class="stats">'+
      '<div class="panel stat good"><span>Pemasukan (lunas)</span><b class="num">'+rp(rev)+'</b><small>'+paid.length+' pesanan lunas</small></div>'+
      '<div class="panel stat warn"><span>Menunggu bayar</span><b class="num">'+rp(wsum)+'</b><small>'+waiting.length+' pesanan</small></div>'+
      '<div class="panel stat coll"><span>Kolektif</span><b class="num">'+rp(csum)+'</b><small>'+coll.length+' pesanan, ditagih bersama</small></div>'+
      '<div class="panel stat"><span>Total pesanan</span><b class="num">'+orders.length+'</b><small>pada periode ini</small></div>'+
      '<div class="panel stat"><span>Rata-rata per pesanan</span><b class="num">'+rp(avg)+'</b><small>hanya yang lunas</small></div></div>'+
    '<div class="panel stack"><h3>Pemasukan 7 hari terakhir</h3>'+chart+'</div>'+
    (empty?'<div class="empty">Belum ada pesanan pada periode ini. Pemasukan muncul setelah pesanan disimpan dan ditandai lunas. Untuk melihat contoh tampilan, buat data contoh di Pengaturan.</div>':
    '<div class="two-col"><div class="panel stack"><h3>Metode pembayaran</h3>'+

function makeSamples(){
  var active=D.menu.filter(function(m){return m.active});
  if(!active.length){S.msg.data={t:'Tambahkan menu dulu.',ok:false};return 0}
  var seedv=7,rnd=function(){seedv=(seedv*16807)%2147483647;return seedv/2147483647};
  var names=['Budi','Sari','Andi','Rina','Dewi','Joko','Tono','Maya'],out=[];
  for(var d=6;d>=0;d--){
    var n=2+Math.floor(rnd()*3);
    for(var k=0;k<n;k++){
      var dt=new Date();dt.setDate(dt.getDate()-d);dt.setHours(8+Math.floor(rnd()*14),Math.floor(rnd()*60),0,0);
      if(dt>new Date())continue;
      var items=[],cnt=1+Math.floor(rnd()*3);
      for(var i=0;i<cnt;i++){
        var m=active[Math.floor(rnd()*active.length)];
        if(!items.some(function(x){return x.name===m.name}))items.push({name:m.name,price:m.price,qty:1+Math.floor(rnd()*2),note:'',custom:false});
      }
      if(rnd()<.15)items.push({name:'Telur ceplok tambahan',price:4000,qty:1,note:'',custom:true});
      var r=rnd(),paid=!(d===0&&r<.5)&&r>.15;
      D.seq++;
      out.push({id:'s'+uid()+D.seq,no:D.seq,ts:dt.toISOString(),customer:names[Math.floor(rnd()*names.length)],table:rnd()<.6?String(1+Math.floor(rnd()*8)):'',note:'',items:items,
        pay:paid?{status:'paid',method:['Cash','Cash','QRIS','Transfer'][Math.floor(rnd()*4)],at:dt.toISOString()}:{status:r<.08?'collective':'waiting'},by:'kasir',sample:true});
    }
  }
  D.orders=D.orders.concat(out);save();return out.length;
}

  else if(f==='customer'||f==='table'||f==='note'){S.f[f]=t.value}

  else if(f==='inote'){var i=S.cart.filter(function(x){return x.key===t.dataset.k})[0];if(i)i.note=t.value}

  else if(f==='oq'){S.of.q=t.value;drawOrders()}

document.addEventListener('change',function(e){

  if(t.dataset.f==='photo'){if(isOwner())handlePhoto(t);return}

    renderView();
  }
});
document.addEventListener('submit',async function(e){
  var form=e.target.closest('[data-form]');if(!form)return;
  e.preventDefault();
  var fd=new FormData(form),kind=form.dataset.form;
  if(kind==='login'){
    var un=String(fd.get('u')||'').trim().toLowerCase(),p=String(fd.get('p')||'');
    var u=D.users.filter(function(x){return x.username.toLowerCase()===un})[0];
    if(u&&u.pw===await pw(u.username,p)){me=u;lsSet(SKEY,u.username);S.loginErr='';S.view='kasir';render()}
    else{S.loginErr='Nama pengguna atau sandi salah.';$('lerr').textContent=S.loginErr}
    return;
  }
  if(!me)return;
  if(kind==='custom'){
    var name=String(fd.get('name')||'').trim(),price=parsePrice(fd.get('price')),qty=parsePrice(fd.get('qty'));
    if(!name||price<=0||qty<1){toast('Isi nama, harga, dan jumlah dengan benar.');return}
    for(var q=0;q<qty;q++)addToCart('c:'+name.toLowerCase()+':'+price,name,price,true);
    form.reset();form.elements.qty.value='1';drawCart();toast('Ditambahkan: '+name);
    return;
  }
  if(kind==='mypw'){
    var cur=String(fd.get('cur')),n1=String(fd.get('n1')),n2=String(fd.get('n2'));
    if(me.pw!==await pw(me.username,cur))S.msg.mypw={t:'Sandi sekarang salah.',ok:false};
    else if(n1.length<4)S.msg.mypw={t:'Sandi baru minimal 4 karakter.',ok:false};
    else if(n1!==n2)S.msg.mypw={t:'Ulangan sandi tidak sama.',ok:false};
    else{me.pw=await pw(me.username,n1);if(me.role==='owner')D.showHint=false;save();S.msg.mypw={t:'Sandi diganti.',ok:true}}
    renderView();return;
  }
  if(!needOwner())return;
  if(kind==='draft'){
    var nm=String(fd.get('name')).trim(),ct=fd.get('cat')==='Minuman'?'Minuman':'Makanan',pr=parsePrice(fd.get('price'));
    if(!nm||pr<=0){S.msg.menu='Kartu belum bisa disimpan: isi nama menu dan harga lebih dari 0.';renderView();return}
    D.menu.push({id:'m'+uid(),name:nm,cat:ct,price:pr,active:true,photo:String(fd.get('photo')||'')});
    S.drafts=S.drafts.filter(function(d){return d.id!==fd.get('id')});
    save();S.msg.menu='';renderView();toast('Menu disimpan: '+nm);return;
  }
  if(kind==='editmenu'){
    var m=D.menu.filter(function(x){return x.id===fd.get('id')})[0];
    var n=String(fd.get('name')).trim(),c=fd.get('cat')==='Minuman'?'Minuman':'Makanan',pp=parsePrice(fd.get('price'));
    if(m&&m.variants){
      var nv=m.variants.map(function(v,i){return {label:String(fd.get('vl'+i)||'').trim(),price:parsePrice(fd.get('vp'+i))}});
      if(n&&nv.every(function(v){return v.label&&v.price>0})){m.name=n;m.cat=c;m.variants=nv;m.price=Math.min.apply(null,nv.map(function(v){return v.price}));m.photo=String(fd.get('photo')||'');save();S.edit=null;renderView()}else toast('Data menu belum benar.');
      return;
    }
    if(m&&n&&pp>0){m.name=n;m.cat=c;m.price=pp;m.photo=String(fd.get('photo')||'');save();S.edit=null;renderView()}else toast('Data menu belum benar.');
    return;
  }
  if(kind==='shop'){var s=String(fd.get('shop')).trim();if(s){D.shop=s;save();S.msg.shop={t:'Nama usaha disimpan.',ok:true};render()}return}
  if(kind==='receipt'){D.receipt={addr:String(fd.get('addr')||'').trim(),tel:String(fd.get('tel')||'').trim(),foot:String(fd.get('foot')||'').trim(),paper:fd.get('paper')==='80'?'80':'58',auto:!!fd.get('auto')};save();S.msg.receipt={t:'Pengaturan struk disimpan.',ok:true};renderView();return}
  if(kind==='adduser'){
    var nn=String(fd.get('name')).trim(),us=String(fd.get('username')).trim().toLowerCase(),pwd=String(fd.get('pw'));
    if(!nn||!/^[a-z0-9._-]{3,20}$/.test(us))S.msg.users={t:'Nama pengguna 3–20 karakter: huruf kecil, angka, titik, strip.',ok:false};
    else if(pwd.length<4)S.msg.users={t:'Sandi minimal 4 karakter.',ok:false};
    else if(D.users.some(function(x){return x.username.toLowerCase()===us}))S.msg.users={t:'Nama pengguna sudah dipakai.',ok:false};
    else{D.users.push({id:'u'+uid(),username:us,name:nn,role:'staff',pw:await pw(us,pwd)});save();S.msg.users={t:'Karyawan ditambahkan. Berikan nama pengguna dan sandi awalnya.',ok:true}}
    renderView();return;
  }
  if(kind==='resetpw'){
    var tu=D.users.filter(function(x){return x.id===fd.get('id')&&x.role==='staff'})[0],np=String(fd.get('pw'));
    if(tu&&np.length>=4){tu.pw=await pw(tu.username,np);save();S.resetId=null;S.msg.users={t:'Sandi '+tu.name+' diganti.',ok:true}}
    else S.msg.users={t:'Sandi baru minimal 4 karakter.',ok:false};
    renderView();return;
  }
  if(kind==='restore'){
    try{
      var obj=JSON.parse(String(fd.get('json')||''));
      if(!validData(obj))throw new Error('x');
      D=migrate(obj);save();
      me=D.users.filter(function(x){return x.id===me.id})[0]||null;
      if(!me){lsDel(SKEY);render();return}
      S.msg.data={t:'Data dipulihkan.',ok:true};render();
    }catch(err){S.msg.data={t:'Cadangan tidak valid. Pastikan seluruh teks tersalin utuh.',ok:false};renderView()}
    return;
  }
});
