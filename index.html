<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kasir Warkop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: satu halaman kasir. Kiri daftar menu, kanan keranjang pesanan (di ponsel ditumpuk, dengan bilah total di bawah). Pemilik mendapat tab tambahan Menu, Keuangan, Pengaturan. */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --surface2:#F4F6F4; --ink:#1E2420; --muted:#66716A; --line:#E1E6E2;
  --accent:#2B8F28; --accent-ink:#FFFFFF; --accent-soft:#E2F2DF; --amber:#FFB81F; --amber-ink:#2A1F00; --info:#2B5FB3; --info-bg:#E2EBF8; --hdr-a:#0D4F27; --hdr-b:#2B8F28; --hdr-ink:#FFFFFF; --sh:0 1px 2px rgba(14,40,22,.05),0 8px 24px rgba(14,40,22,.06);
  --good:#1E7A4B; --good-bg:#DDF1E5; --warn:#A65A05; --warn-bg:#FBEBD3; --bad:#B3261E; --bad-bg:#F9DEDC;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111713; --surface:#1A221D; --surface2:#222B25; --ink:#E8EEE9; --muted:#98A59D; --line:#2D3832;
    --accent:#5FC956; --accent-ink:#0C1F0A; --accent-soft:#1F3A1D; --amber:#FFC247; --amber-ink:#241A00; --info:#8DB4F2; --info-bg:#1C2A44; --hdr-a:#0F3320; --hdr-b:#1D5C2C; --hdr-ink:#E9F6E7; --sh:0 1px 2px rgba(0,0,0,.45);
    --good:#6FD39A; --good-bg:#1D3A2A; --warn:#F0B35E; --warn-bg:#3D2E14; --bad:#F2938C; --bad-bg:#43201E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#1A221D; --surface2:#222B25; --ink:#E8EEE9; --muted:#98A59D; --line:#2D3832;
  --accent:#5FC956; --accent-ink:#0C1F0A; --accent-soft:#1F3A1D; --amber:#FFC247; --amber-ink:#241A00; --info:#8DB4F2; --info-bg:#1C2A44; --hdr-a:#0F3320; --hdr-b:#1D5C2C; --hdr-ink:#E9F6E7; --sh:0 1px 2px rgba(0,0,0,.45);
  --good:#6FD39A; --good-bg:#1D3A2A; --warn:#F0B35E; --warn-bg:#3D2E14; --bad:#F2938C; --bad-bg:#43201E;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);
  padding-block:12px 104px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.2}
h3{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted,.hint{color:var(--muted)}
.hint{font-size:13px}

/* controls */
.inp{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.inp.sm{min-height:38px;padding:6px 10px;font-size:14px}
textarea.inp{min-height:68px;resize:vertical}
.inp::placeholder{color:var(--muted);opacity:.8}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger-t{color:var(--bad)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.paid{background:var(--good-bg);color:var(--good)}
.pill.waiting{background:var(--warn-bg);color:var(--warn)}
.pill.collective{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;vertical-align:middle}
.empty{padding:28px 16px;text-align:left;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:20px}

/* login */
.login{max-width:400px;margin:7vh auto 0;display:grid;gap:16px}
.login h1{font-size:30px}
.login form{display:grid;gap:14px}

/* header + tabs */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 12px}
.brand{font-family:var(--font-display);font-weight:700;font-size:23px;letter-spacing:-.01em}
.clock{color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.uname{font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

/* kasir */
.pos{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.pos-menu{display:grid;gap:14px;align-content:start;min-width:0}
.tools{display:grid;gap:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.item{position:relative;display:grid;grid-template-rows:auto 1fr;text-align:left;padding:0;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.item:active{background:var(--surface2)}
.it-b{display:grid;gap:2px;padding:10px 12px;align-content:start}
.item .nm{font-weight:600;line-height:1.25}
.item .pr{color:var(--muted);font-size:14px;font-weight:600}
.item[disabled]{opacity:.55;cursor:not-allowed}
.item[disabled] img{filter:grayscale(1)}
.ph{display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;background:var(--surface2);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph i{font:700 32px var(--font-display);font-style:normal;color:var(--muted)}
.mcard .ph{border-radius:8px}
.photo{display:grid;place-items:center;aspect-ratio:4/3;max-width:100%;background:var(--surface2);border:1px dashed var(--line);border-radius:8px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.ph-empty{color:var(--muted);font-size:13px;font-weight:600}
.filebtn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.item .badge{position:absolute;top:8px;right:8px;min-width:24px;height:24px;padding:0 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700;display:grid;place-items:center}
.custom{display:grid;gap:10px}
.custom form{display:grid;gap:10px;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,.6fr) auto;align-items:end}
.pos-cart{display:grid;gap:12px;align-content:start;min-width:0}
.pos-cart h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.two{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stamp{font-size:13px;font-weight:600;color:var(--accent)}
.cl{display:grid;gap:10px}
.ci{display:grid;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ci-top{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.ci-ctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{width:38px;height:38px;border:0;background:var(--surface2);font-size:18px;font-weight:700}
.qty span{min-width:32px;text-align:center;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{min-height:42px;border:0;background:var(--surface);font-weight:700}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].u{background:var(--warn-bg);color:var(--warn)}
.seg button[aria-pressed="true"].k{background:var(--accent-soft);color:var(--accent)}
.seg button[aria-pressed="true"].p{background:var(--good-bg);color:var(--good)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:4px}
.total b{font-family:var(--font-display);font-size:26px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock b{font-family:var(--font-display);font-size:19px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:9;max-width:calc(100vw - 32px);padding:11px 16px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (min-width:820px){
  .pos{grid-template-columns:minmax(0,1fr) 390px;align-items:start}
  .pos-cart{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  .dock{display:none!important}
  body{padding-bottom:40px}
}
@media (max-width:560px){
  .custom form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .custom form .btn{grid-column:1 / -1}
}

/* pesanan */
.toolbar{display:grid;gap:10px;margin-bottom:12px}
.osum{margin:4px 0 12px;font-weight:600;color:var(--muted)}
.olist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.oc{display:grid;gap:10px;align-content:start;min-width:0}
.oc-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.oc-h b{font-family:var(--font-display);font-size:18px}
.oc-t{font-size:13px;color:var(--muted)}
.oc ul{display:grid;gap:6px}
.oc li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.oc li small{display:block;color:var(--muted)}
.onote{padding:8px 10px;background:var(--surface2);border-radius:8px;font-size:14px}
.oc-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.oc-f b{font-size:17px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* pilihan varian */
.pick-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.pick{background:var(--surface);color:var(--ink);border-radius:16px;padding:16px;width:min(440px,100%);max-height:85vh;overflow:auto;display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.pick-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px}
.pick-l{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick-o{display:grid;gap:2px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.pick-o:hover,.pick-o:focus-visible{border-color:var(--accent);outline:2px solid var(--accent)}
.pick-o span{font-size:14px;font-weight:600}
/* menu + pengaturan */
.stack{display:grid;gap:14px}
.frow{display:grid;gap:10px;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr) auto;align-items:end}
@media (max-width:640px){.frow{grid-template-columns:minmax(0,1fr)}}
.gsecs{display:grid;gap:22px}
.gsec{display:grid;gap:12px;align-content:start}
.gh{display:flex;align-items:center;gap:10px;font-size:19px}
.gh::after{content:"";flex:1;height:1px;background:var(--line)}
.menu-h .gh::after{display:none}
.menu-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.mgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));align-items:start}
.mcard{display:grid;gap:10px;align-content:start;min-width:0}
.mcard.draft{background:transparent;border-style:dashed}
.mg{display:grid;gap:8px}
.mr{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.mr:first-child{border-top:0}
.mr.edit{display:block}
.mr-main{display:grid;min-width:0}
.mr-name{font-weight:600}
.mr-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sw{min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);font-weight:700;font-size:13px}
.sw[aria-checked="true"]{background:var(--good-bg);color:var(--good);border-color:transparent}
.sw[aria-checked="false"]{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.two-col{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}
.ul{display:grid}
.ur{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.ur:first-child{border-top:0}
.bk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:110px}

/* keuangan */
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.stat{display:grid;gap:4px}
.stat span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--font-display);font-size:26px;line-height:1.1}
.stat small{color:var(--muted)}
.stat.good b{color:var(--good)}
.stat.warn b{color:var(--warn)}
.stat.coll b{color:var(--accent)}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.bar{display:grid;gap:6px;text-align:center;min-width:0}
.bar-v{font-size:12px;font-weight:700;color:var(--muted)}
.bar-col{height:130px;display:flex;align-items:flex-end;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar-fill{width:100%;background:var(--accent-soft);border-radius:6px 6px 0 0;min-height:0}
.bar-fill.now{background:var(--accent)}
.bar-l{font-size:12px;color:var(--muted);line-height:1.25}
.bar-l b{display:block;color:var(--ink);font-size:14px}
.rank{display:grid;gap:10px}
.rk{display:grid;gap:4px}
.rk-h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.rk-h span:first-child{font-weight:600;min-width:0}
.rk-b{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.rk-b i{display:block;height:100%;background:var(--accent);border-radius:99px}
@media (prefers-reduced-motion:no-preference){.bar-fill,.rk-b i{transition:height .3s ease,width .3s ease}}

/* ---- tampilan kasir ala POS: pesanan di kiri, katalog di kanan ---- */
.wrap{max-width:1280px}
.top{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:12px 18px}
.clock{color:inherit;opacity:.85}
.role{background:color-mix(in srgb,var(--accent-ink) 18%,transparent);color:inherit}
.top .btn.ghost{color:inherit;border-color:color-mix(in srgb,var(--accent-ink) 45%,transparent)}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.pill.collective{background:var(--info-bg);color:var(--info)}
.seg button[aria-pressed="true"].k{background:var(--info-bg);color:var(--info)}
.stat.coll b{color:var(--info)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.big{min-height:52px;border-radius:99px;font-size:17px}

.searchbar{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 10px 0 18px;background:var(--surface);border-radius:99px;color:var(--muted)}
.searchbar:focus-within{outline:2px solid var(--accent)}
.searchbar svg{flex:none}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;min-height:44px;outline:none}
.searchbar input::placeholder{color:var(--muted)}
.sdiv{width:1px;height:26px;background:var(--line);flex:none}
.selw{position:relative;display:inline-flex;align-items:center;flex:none}
.selw select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:10px 26px 10px 8px;min-height:44px;cursor:pointer;max-width:150px}
.selw svg{position:absolute;right:6px;pointer-events:none;color:var(--muted)}
.cats{gap:10px}
.cats .chip{min-height:46px;padding:0 22px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);display:inline-flex;align-items:center;gap:8px;font-size:15px}
.cats .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.gsecs .gh{font-size:16px;color:var(--muted);font-weight:600}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:14px}
.item{border:0;border-radius:16px;padding:10px 10px 14px;text-align:center;box-shadow:0 1px 3px rgba(20,40,25,.08)}
.item .ph{border-radius:12px}
.it-b{padding:10px 4px 0;text-align:center;gap:4px}
.item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.item .pr{color:var(--ink);font-weight:700;font-size:15px}
.item .badge{top:16px;right:16px}

.pos-cart{display:flex;flex-direction:column;gap:0;min-width:0;background:var(--surface);border:0;border-radius:18px;padding:0;overflow:hidden;align-content:normal}
.cart-h{display:flex;align-items:center;gap:8px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--line)}
.ono{font-weight:700;color:var(--muted);font-size:13px;min-width:48px}
.cname{flex:1;min-width:0;text-align:center;border:0;background:transparent;color:var(--accent);font:600 18px var(--font-display);min-height:42px}
.cname::placeholder{color:var(--accent);opacity:.65}
.icon-btn{width:42px;height:42px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--surface2)}
.cart-detail{display:grid;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface2)}
.cart-body{flex:1;min-height:110px;overflow:auto;padding:2px 16px 8px}
.cart-empty{padding:26px 2px;color:var(--muted)}
.cl{display:grid}
.ci{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.ci-top{font-size:16px}
.ci-name{font-weight:700;min-width:0;overflow-wrap:anywhere}

async function hash(s){
  try{
    if(window.crypto&&crypto.subtle){
      var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
      return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
    }
  }catch(e){}
  var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;
  return 'f'+(h>>>0).toString(16);
}
function pw(u,p){return hash('warkop|'+String(u).toLowerCase()+'|'+p)}

    L.push(m)}
  [['Ayam Goreng Kremes',12],['Nasi Goreng',12],['Ifu Mie',12],['Mie Tiau',12],['Indomie Goreng',12],['Indomie Kuah',12],

  ].forEach(function(x){add(x[0],'Minuman',x[1])});

  var beans=['Robusta Gayo','Arabika Gayo','Arabika Peaberry'];

   ['Caffe Latte',[[12,15],[14,17],[15,18]]],['Kopi Susu',[[12,15],[14,17],[15,18]]],['Kopi Susu GL Aren',[[14,17],[16,19],[17,20]]],
   ['Espresso Double',[[15,17],[17,19],[18,20]]]
  ].forEach(function(c){var vs=[];c[1].forEach(function(p,i){vs.push([beans[i]+' · Panas',p[0]]);vs.push([beans[i]+' · Dingin',p[1]])});add(c[0],'Minuman',vs[0][1],vs)});
  [['Matcha Coffee Latte',20],['Avocado Coffee Latte',20],['Caramel Coffee Latte',20],['Mocha Coffee Latte',20],['Thai Tea',10],['Matcha',10],['Coklat',10],['Red Velvet',10],['Taro',10],['Cappucino',10]
  ].forEach(function(x){add(x[0],'Minuman',x[1])});
  return L;
}

      {id:'u1',username:'pemilik',name:'Pemilik',role:'owner',pw:await pw('pemilik','1234')},

    menu:defaultMenu(),
    orders:[]};
}
function validData(d){return d&&Array.isArray(d.users)&&Array.isArray(d.menu)&&Array.isArray(d.orders)&&d.users.some(function(u){return u.role==='owner'})}
/* v2: menu contoh dikosongkan; status bayar jadi Menunggu / Kolektif / Lunas; metode Cash / QRIS / Transfer */
function migrate(d){
  if((d.v||1)<2){
    d.menu=d.menu.filter(function(m){return !/^m\d{1,2}$/.test(m.id)});
    d.orders.forEach(function(o){
      if(o.pay&&o.pay.status==='unpaid')o.pay={status:'waiting'};
      if(o.pay&&o.pay.method==='Tunai')o.pay.method='Cash';
    });
    d.v=2;
  }
  if(d.v<3){
    /* v3: menu dikelompokkan jadi Makanan (atas) dan Minuman (bawah) */
    d.menu.forEach(function(m){
      if(m.cat!=='Makanan'&&m.cat!=='Minuman')m.cat=/kopi|teh|jeruk|susu|jus|\bes\b|minum|air|sirup|soda/i.test(m.cat+' '+m.name)?'Minuman':'Makanan';
    });
    d.v=3;
  }
  if(d.v<4){
    /* v4: isi menu Warkop Waras jika daftar menu masih kosong */
    if(!d.menu.length)d.menu=defaultMenu();
    d.v=4;
  }
  if(d.v<5){
    /* v5: menu bawaan memakai pilihan (Panas/Dingin, jenis biji) dalam satu menu */
    if(d.menu.some(function(m){return /^w\d{3}$/.test(m.id)})){
      d.menu=d.menu.filter(function(m){return !/^w\d{3}$/.test(m.id)}).concat(defaultMenu());
    }
    d.v=5;
  }
  return d;
}
function grp(m){return m.cat==='Minuman'?'Minuman':'Makanan'}
function load(){try{var r=lsGet(KEY);if(r){var d=JSON.parse(r);if(validData(d))return migrate(d)}}catch(e){}return null}
function save(){if(!lsSet(KEY,JSON.stringify(D)))toast('Data belum tersimpan permanen di perangkat ini (penyimpanan penuh atau diblokir peramban).')}

var S={view:'kasir',q:'',cat:'Semua',cart:[],mq:'',sort:'name',showDetail:true,showCustom:false,paySheet:false,

}

function addToCart(key,name,price,custom){

function saveOrder(status){
  if(!S.cart.length){toast('Keranjang masih kosong.');return}
  var when=S.f.when?new Date(S.f.when):new Date();
  if(isNaN(when)){toast('Waktu pesanan belum valid.');return}
  status=status||'waiting';
  D.seq++;
  var paid=status==='paid';
  var o={id:'o'+uid(),no:D.seq,ts:when.toISOString(),customer:S.f.customer.trim(),table:S.f.table.trim(),note:S.f.note.trim(),svc:S.f.svc,
    items:S.cart.map(function(i){return {name:i.name,price:i.price,qty:i.qty,note:i.note.trim(),custom:i.custom}}),
    pay:paid?{status:'paid',method:S.f.method,at:new Date().toISOString()}:{status:status},by:me.username};
  D.orders.push(o);save();
  S.cart=[];S.paySheet=false;
  S.f={customer:'',table:'',note:'',when:null,pay:'waiting',method:S.f.method,svc:S.f.svc};
  drawGrid();drawCart();
  toast('Pesanan '+num(o.no)+' disimpan ('+rp(otot(o))+', '+ST[o.pay.status].toLowerCase()+(paid?' · '+o.pay.method:'')+')');
}

function handlePhoto(inp){
  var file=inp.files&&inp.files[0];if(!file)return;
  if(!/^image\//.test(file.type)){toast('Pilih file gambar.');return}
  var rd=new FileReader();
  rd.onerror=function(){toast('Foto tidak bisa dibaca.')};
  rd.onload=function(){
    var img=new Image();
    img.onerror=function(){toast('Format foto ini tidak didukung. Coba foto JPG atau PNG.')};
    img.onload=function(){
      var s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2,N=360;
      var c=document.createElement('canvas');c.width=N;c.height=N;
      c.getContext('2d').drawImage(img,sx,sy,s,s,0,0,N,N);

function viewKeuangan(){
  if(!isOwner())return '';
  var rg=[['today','Hari ini'],['7d','7 hari'],['month','Bulan ini'],['all','Semua']];
  var orders=D.orders.filter(function(o){return inRange(o,S.frange)});
  var paid=orders.filter(function(o){return o.pay.status==='paid'});
  var waiting=orders.filter(function(o){return o.pay.status==='waiting'});
  var coll=orders.filter(function(o){return o.pay.status==='collective'});
  var rev=paid.reduce(function(s,o){return s+otot(o)},0);
  var wsum=waiting.reduce(function(s,o){return s+otot(o)},0);
  var csum=coll.reduce(function(s,o){return s+otot(o)},0);
  var avg=paid.length?rev/paid.length:0;
  var days=[];
  for(var k=6;k>=0;k--){
    var b=new Date();b=new Date(b.getFullYear(),b.getMonth(),b.getDate()-k);
    var e=new Date(b.getFullYear(),b.getMonth(),b.getDate()+1);
    var v=D.orders.filter(function(o){var t=new Date(o.ts);return o.pay.status==='paid'&&t>=b&&t<e}).reduce(function(s,o){return s+otot(o)},0);
    days.push({v:v,wk:new Intl.DateTimeFormat('id-ID',{weekday:'short'}).format(b),dt:b.getDate(),now:k===0});
  }
  var max=Math.max.apply(null,days.map(function(d){return d.v}).concat([1]));
  var chart='<div class="bars" role="img" aria-label="Pemasukan lunas per hari selama 7 hari terakhir">'+days.map(function(d){
    return '<div class="bar"><div class="bar-v num">'+short(d.v)+'</div><div class="bar-col"><div class="bar-fill'+(d.now?' now':'')+'" style="height:'+(d.v?Math.max(4,d.v/max*100):0)+'%"></div></div><div class="bar-l">'+d.wk+'<b class="num">'+d.dt+'</b></div></div>';
  }).join('')+'</div>';
  var byM={};paid.forEach(function(o){byM[o.pay.method]=(byM[o.pay.method]||0)+otot(o)});
  var mrows=Object.keys(byM).sort(function(a,b){return byM[b]-byM[a]});
  var mx=Math.max.apply(null,mrows.map(function(m){return byM[m]}).concat([1]));
  var top={};orders.forEach(function(o){o.items.forEach(function(i){var t=top[i.name]||(top[i.name]={q:0,v:0});t.q+=i.qty;t.v+=i.qty*i.price})});
  var trows=Object.keys(top).sort(function(a,b){return top[b].q-top[a].q}).slice(0,6);
  var tx=Math.max.apply(null,trows.map(function(n){return top[n].q}).concat([1]));
  var empty=!orders.length;
  return '<div class="stack"><div class="chips">'+rg.map(function(x){return '<button class="chip" data-act="frange" data-v="'+x[0]+'" aria-pressed="'+(S.frange===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'+
    '<div class="stats">'+
      '<div class="panel stat good"><span>Pemasukan (lunas)</span><b class="num">'+rp(rev)+'</b><small>'+paid.length+' pesanan lunas</small></div>'+
      '<div class="panel stat warn"><span>Menunggu bayar</span><b class="num">'+rp(wsum)+'</b><small>'+waiting.length+' pesanan</small></div>'+
      '<div class="panel stat coll"><span>Kolektif</span><b class="num">'+rp(csum)+'</b><small>'+coll.length+' pesanan, ditagih bersama</small></div>'+
      '<div class="panel stat"><span>Total pesanan</span><b class="num">'+orders.length+'</b><small>pada periode ini</small></div>'+
      '<div class="panel stat"><span>Rata-rata per pesanan</span><b class="num">'+rp(avg)+'</b><small>hanya yang lunas</small></div></div>'+
    '<div class="panel stack"><h3>Pemasukan 7 hari terakhir</h3>'+chart+'</div>'+
    (empty?'<div class="empty">Belum ada pesanan pada periode ini. Pemasukan muncul setelah pesanan disimpan dan ditandai lunas. Untuk melihat contoh tampilan, buat data contoh di Pengaturan.</div>':
    '<div class="two-col"><div class="panel stack"><h3>Metode pembayaran</h3>'+
      (mrows.length?'<div class="rank">'+mrows.map(function(m){return '<div class="rk"><div class="rk-h"><span>'+esc(m)+'</span><span class="num">'+rp(byM[m])+'</span></div><div class="rk-b"><i style="width:'+(byM[m]/mx*100)+'%"></i></div></div>'}).join('')+'</div>':'<p class="hint">Belum ada pembayaran lunas.</p>')+
      '</div><div class="panel stack"><h3>Menu terlaris</h3><div class="rank">'+
      trows.map(function(n){return '<div class="rk"><div class="rk-h"><span>'+esc(n)+'</span><span class="num">'+top[n].q+' porsi · '+rp(top[n].v)+'</span></div><div class="rk-b"><i style="width:'+(top[n].q/tx*100)+'%"></i></div></div>'}).join('')+'</div></div></div>')+
    '</div>';
}

function makeSamples(){
  var active=D.menu.filter(function(m){return m.active});
  if(!active.length){S.msg.data={t:'Tambahkan menu dulu.',ok:false};return 0}
  var seedv=7,rnd=function(){seedv=(seedv*16807)%2147483647;return seedv/2147483647};
  var names=['Budi','Sari','Andi','Rina','Dewi','Joko','Tono','Maya'],out=[];
  for(var d=6;d>=0;d--){
    var n=2+Math.floor(rnd()*3);
    for(var k=0;k<n;k++){
      var dt=new Date();dt.setDate(dt.getDate()-d);dt.setHours(8+Math.floor(rnd()*14),Math.floor(rnd()*60),0,0);
      if(dt>new Date())continue;
      var items=[],cnt=1+Math.floor(rnd()*3);
      for(var i=0;i<cnt;i++){
        var m=active[Math.floor(rnd()*active.length)];
        if(!items.some(function(x){return x.name===m.name}))items.push({name:m.name,price:m.price,qty:1+Math.floor(rnd()*2),note:'',custom:false});
      }
      if(rnd()<.15)items.push({name:'Telur ceplok tambahan',price:4000,qty:1,note:'',custom:true});
      var r=rnd(),paid=!(d===0&&r<.5)&&r>.15;
      D.seq++;
      out.push({id:'s'+uid()+D.seq,no:D.seq,ts:dt.toISOString(),customer:names[Math.floor(rnd()*names.length)],table:rnd()<.6?String(1+Math.floor(rnd()*8)):'',note:'',items:items,
        pay:paid?{status:'paid',method:['Cash','Cash','QRIS','Transfer'][Math.floor(rnd()*4)],at:dt.toISOString()}:{status:r<.08?'collective':'waiting'},by:'kasir',sample:true});
    }
  }
  D.orders=D.orders.concat(out);save();return out.length;
}

  if(kind==='login'){
    var un=String(fd.get('u')||'').trim().toLowerCase(),p=String(fd.get('p')||'');
    var u=D.users.filter(function(x){return x.username.toLowerCase()===un})[0];
    if(u&&u.pw===await pw(u.username,p)){me=u;lsSet(SKEY,u.username);S.loginErr='';S.view='kasir';render()}
    else{S.loginErr='Nama pengguna atau sandi salah.';$('lerr').textContent=S.loginErr}
    return;
  }
  if(!me)return;
  if(kind==='custom'){
    var name=String(fd.get('name')||'').trim(),price=parsePrice(fd.get('price')),qty=parsePrice(fd.get('qty'));
    if(!name||price<=0||qty<1){toast('Isi nama, harga, dan jumlah dengan benar.');return}
    for(var q=0;q<qty;q++)addToCart('c:'+name.toLowerCase()+':'+price,name,price,true);
    form.reset();form.elements.qty.value='1';drawCart();toast('Ditambahkan: '+name);
    return;
  }
  if(kind==='mypw'){
    var cur=String(fd.get('cur')),n1=String(fd.get('n1')),n2=String(fd.get('n2'));
    if(me.pw!==await pw(me.username,cur))S.msg.mypw={t:'Sandi sekarang salah.',ok:false};
    else if(n1.length<4)S.msg.mypw={t:'Sandi baru minimal 4 karakter.',ok:false};
    else if(n1!==n2)S.msg.mypw={t:'Ulangan sandi tidak sama.',ok:false};
    else{me.pw=await pw(me.username,n1);if(me.role==='owner')D.showHint=false;save();S.msg.mypw={t:'Sandi diganti.',ok:true}}
    renderView();return;
  }
  if(!needOwner())return;
  if(kind==='draft'){
    var nm=String(fd.get('name')).trim(),ct=fd.get('cat')==='Minuman'?'Minuman':'Makanan',pr=parsePrice(fd.get('price'));
    if(!nm||pr<=0){S.msg.menu='Kartu belum bisa disimpan: isi nama menu dan harga lebih dari 0.';renderView();return}
    D.menu.push({id:'m'+uid(),name:nm,cat:ct,price:pr,active:true,photo:String(fd.get('photo')||'')});
    S.drafts=S.drafts.filter(function(d){return d.id!==fd.get('id')});
    save();S.msg.menu='';renderView();toast('Menu disimpan: '+nm);return;
  }
  if(kind==='editmenu'){
    var m=D.menu.filter(function(x){return x.id===fd.get('id')})[0];
    var n=String(fd.get('name')).trim(),c=fd.get('cat')==='Minuman'?'Minuman':'Makanan',pp=parsePrice(fd.get('price'));
    if(m&&m.variants){
      var nv=m.variants.map(function(v,i){return {label:String(fd.get('vl'+i)||'').trim(),price:parsePrice(fd.get('vp'+i))}});
      if(n&&nv.every(function(v){return v.label&&v.price>0})){m.name=n;m.cat=c;m.variants=nv;m.price=Math.min.apply(null,nv.map(function(v){return v.price}));m.photo=String(fd.get('photo')||'');save();S.edit=null;renderView()}else toast('Data menu belum benar.');
      return;
    }
    if(m&&n&&pp>0){m.name=n;m.cat=c;m.price=pp;m.photo=String(fd.get('photo')||'');save();S.edit=null;renderView()}else toast('Data menu belum benar.');
    return;
  }
  if(kind==='shop'){var s=String(fd.get('shop')).trim();if(s){D.shop=s;save();S.msg.shop={t:'Nama usaha disimpan.',ok:true};render()}return}
  if(kind==='adduser'){
    var nn=String(fd.get('name')).trim(),us=String(fd.get('username')).trim().toLowerCase(),pwd=String(fd.get('pw'));
    if(!nn||!/^[a-z0-9._-]{3,20}$/.test(us))S.msg.users={t:'Nama pengguna 3–20 karakter: huruf kecil, angka, titik, strip.',ok:false};
    else if(pwd.length<4)S.msg.users={t:'Sandi minimal 4 karakter.',ok:false};
    else if(D.users.some(function(x){return x.username.toLowerCase()===us}))S.msg.users={t:'Nama pengguna sudah dipakai.',ok:false};
    else{D.users.push({id:'u'+uid(),username:us,name:nn,role:'staff',pw:await pw(us,pwd)});save();S.msg.users={t:'Karyawan ditambahkan. Berikan nama pengguna dan sandi awalnya.',ok:true}}
    renderView();return;
  }
  if(kind==='resetpw'){
    var tu=D.users.filter(function(x){return x.id===fd.get('id')&&x.role==='staff'})[0],np=String(fd.get('pw'));
    if(tu&&np.length>=4){tu.pw=await pw(tu.username,np);save();S.resetId=null;S.msg.users={t:'Sandi '+tu.name+' diganti.',ok:true}}
    else S.msg.users={t:'Sandi baru minimal 4 karakter.',ok:false};
    renderView();return;
  }
  if(kind==='restore'){
    try{
      var obj=JSON.parse(String(fd.get('json')||''));
      if(!validData(obj))throw new Error('x');
      D=migrate(obj);save();
      me=D.users.filter(function(x){return x.id===me.id})[0]||null;
      if(!me){lsDel(SKEY);render();return}
      S.msg.data={t:'Data dipulihkan.',ok:true};render();
    }catch(err){S.msg.data={t:'Cadangan tidak valid. Pastikan seluruh teks tersalin utuh.',ok:false};renderView()}
    return;
  }
});

/* ---------- mulai ---------- */
(async function(){
  D=load();
  if(!D)D=await seed();
  save();
  var sn=lsGet(SKEY);
  if(sn)me=D.users.filter(function(x){return x.username===sn})[0]||null;
  render();
})();
})();
</script>

</body></html>
